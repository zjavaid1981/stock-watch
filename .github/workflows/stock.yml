name: iphone-stock

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 min (GitHub may start runs a few minutes late)
  workflow_dispatch:           # lets you run it manually from the Actions tab

concurrency:
  group: iphone-stock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Check iPhone Duo stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSTAL: ${{ secrets.POSTAL }}
        run: >
          python3 iphone_stock.py
          --postal "$POSTAL"
          --model "iPhone Duo"
          --radius 100
          --notify "$NTFY_TOPIC"
          --always-alert
          --heartbeat
          --no-beep
