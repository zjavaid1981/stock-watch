name: iphone-stock_manual

# Self-sustaining loop that does not depend on GitHub's flaky cron.
#
# How it works:
#   1. Start it once with "Run workflow" on the Actions tab.
#   2. The "loop" job runs iphone_stock.py every 10 s for ~5h45m
#      (GitHub hard-limits a hosted job to 6 hours).
#   3. When it finishes, the SAME job's last step queues the next run (and checks that the new run
#      really started, retrying if GitHub failed to start it). A separate "relaunch" job does the same
#      as a fallback, so one GitHub hiccup cannot break the chain. The gap is a few seconds.
#
# To STOP it:  Actions -> iphone-stock_manual -> "..." menu -> Disable workflow,
#              then cancel the run that is in progress.
#              (Cancelling alone stops the chain; the 2-hourly safety net below
#              would restart it, which is why you also disable the workflow.)

on:
  workflow_dispatch:           # start it manually from the Actions tab
  schedule:
    - cron: "41 */2 * * *"     # safety net only: restarts the loop if the chain ever breaks.
                               # If a loop is already running this just queues behind it,
                               # and a newer queued run replaces it, so there are no duplicates.

# Only one loop at a time. A newly started run waits for the current one to finish.
concurrency:
  group: iphone-stock-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write             # lets the last step queue the next run
    steps:
      - uses: actions/checkout@v4

      - name: Check iPhone Duo stock every 10 seconds (~5h45m)
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSTAL: ${{ secrets.POSTAL }}
          TZ: America/Toronto
        run: |
          END=$(( $(date +%s) + 20700 ))      # 345 minutes from now
          while [ "$(date +%s)" -lt "$END" ]; do
            LEFT=$(( END - $(date +%s) ))
            # SIGINT lets the script exit cleanly when time is up.
            # If the script ever crashes, the wrapper restarts it after 30 s.
            timeout -s INT "$LEFT" python3 -u iphone_stock.py \
              --postal "$POSTAL" \
              --model "iPhone Duo" \
              --radius 100 \
              --notify "$NTFY_TOPIC" \
              --always-alert \
              --no-beep \
              --heartbeat-minutes 60 \
              --watch 10 \
              || echo "[wrapper] iphone_stock.py exited with code $?"
            if [ "$(date +%s)" -lt "$END" ]; then sleep 30; fi
          done
          echo "[wrapper] time window finished; handing over to the next run"

      - name: Queue the next run (and verify it started)
        if: ${{ !cancelled() }}      # a manual cancel stops the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ensure_next_run.sh

  relaunch:                          # fallback: only does anything if the step above could not run
    needs: loop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Make sure a next run exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ensure_next_run.sh
